name: Maintenance / full
jobs:
  test-blender-5:
    name: Test with Blender 5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Verify and record source revision
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        printf "Tested source: %s\n" "$EXPECTED_SOURCE_SHA"
    - name: Setup Blender
      uses: ./.github/actions/setup-blender
      with:
        version: '5.0.0'
    - name: Run test suite
      run: |
        cd blender_blocking
        xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python test_runner.py
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-blender-5
        path: |
          blender_blocking/*.log
          blender_blocking/test_images/
        retention-days: 7
  test-blender-4:
    name: Test with Blender 4.2 (LTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Verify and record source revision
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        printf "Tested source: %s\n" "$EXPECTED_SOURCE_SHA"
    - name: Setup Blender
      uses: ./.github/actions/setup-blender
      with:
        version: '4.2.0'
    - name: Run test suite
      run: |
        cd blender_blocking
        xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python test_runner.py
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-blender-4
        path: |
          blender_blocking/*.log
          blender_blocking/test_images/
        retention-days: 7
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
        description: Immutable source SHA resolved by the trusted adaptive dispatcher
