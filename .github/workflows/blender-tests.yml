name: Blender Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'blender_blocking/**'
      - '.github/workflows/blender-tests.yml'
      - '.github/actions/setup-blender/**'
      - '.github/ci/setup-blender.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'blender_blocking/**'
      - '.github/workflows/blender-tests.yml'
      - '.github/actions/setup-blender/**'
      - '.github/ci/setup-blender.sh'

jobs:
  test-blender-stable:
    name: Test with Blender 5.2.2 (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Blender
        uses: ./.github/actions/setup-blender
        with:
          version: '5.2.2'

      - name: Run test suite
        run: |
          cd blender_blocking
          xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python test_runner.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-blender-stable
          path: |
            blender_blocking/*.log
            blender_blocking/test_images/
          retention-days: 7

  quick-check:
    name: Quick smoke test (pre-merge)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Blender
        uses: ./.github/actions/setup-blender
        with:
          version: '5.2.2'

      - name: Run quick tests
        run: |
          cd blender_blocking
          xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python test_runner.py -- --quick
